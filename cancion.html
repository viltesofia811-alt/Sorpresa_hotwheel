<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Una canción para vos 💙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dff6ff, #8ed8ff, #4aa9e8);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.carta {
    width: 100%;
    max-width: 500px;
    background: rgba(255,255,255,0.96);
    border: 5px solid #1677b9;
    border-radius: 30px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,80,140,0.3);
}

.icono {
    font-size: 50px;
}

h1 {
    color: #075b96;
    font-size: 30px;
}

p {
    color: #174b6b;
    font-size: 18px;
    line-height: 1.6;
}

.cancion {
    display: block;
    margin: 25px auto;
    padding: 18px;
    background: #e5f7ff;
    border: 3px solid #4aa9e8;
    border-radius: 20px;
    color: #075b96;
    font-weight: bold;
    text-decoration: none;
}

button {
    margin-top: 10px;
    background: linear-gradient(135deg, #087ac1, #49bfff);
    color: white;
    border: none;
    padding: 16px 30px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,90,150,0.3);
}
</style>
</head>

<body>

<div class="carta">

<div class="icono">🎵💙</div>

<h1>Una canción para vos 🩵</h1>

<p>
Elegi esta cancion por que me recuerda a vos y a cuando eramos unos nenes conociendonos 🥺
</p>

<a class="cancion"
href="https://www.youtube.com/watch?v=wAjHQXrIj9o"
target="_blank">
🎵 Ojitos Lindos — Bad Bunny & Bomba Estéreo
</a>

<button onclick="location.href='recuerdos.html'">
📸 SEGUIR
</button>

</div>

</body>
</html>
