<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para mi gordito 💙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dff6ff, #8ed8ff, #4aa9e8);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    overflow: hidden;
}

body::before {
    content: "🏎️  🩵  🏁  💙  🏎️  🩵  🏁";
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 25px;
    opacity: 0.8;
}

.carta {
    width: 100%;
    max-width: 500px;
    background: rgba(255, 255, 255, 0.95);
    border: 5px solid #1677b9;
    border-radius: 30px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 80, 140, 0.3);
}

h1 {
    color: #075b96;
    font-size: 32px;
    margin-bottom: 20px;
}

p {
    color: #174b6b;
    font-size: 18px;
    line-height: 1.6;
}

.corazon {
    font-size: 45px;
    margin: 10px;
}

button {
    margin-top: 25px;
    background: linear-gradient(135deg, #087ac1, #49bfff);
    color: white;
    border: none;
    padding: 16px 30px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0, 90, 150, 0.3);
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<div class="carta">

    <div class="corazon">💙</div>

    <h1>Feliz día de Hot Wheels, mi amor 🏎️</h1>

    <p>
        Quería hacerte algo especial porque, aunque estemos a distancia,
        quería encontrar una manera de estar presente en este día.
    </p>

    <button onclick="location.href='carta.html'">
        💌 ABRIR MI SORPRESA
    </button>

</div>

</body>
</html>
