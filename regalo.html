<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi regalo para vos ❤️</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#0757a8;
    color:white;
}

.contenedor{
    min-height:100vh;
    padding:25px 14px 40px;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(45deg,#fff 25%,transparent 25%) 0 0/38px 38px,
        linear-gradient(-45deg,#fff 25%,transparent 25%) 0 0/38px 38px,
        linear-gradient(45deg,transparent 75%,#fff 75%) 0 0/38px 38px,
        linear-gradient(-45deg,transparent 75%,#fff 75%) 0 0/38px 38px,
        #111;
}

.regalo{
    width:100%;
    max-width:520px;
    padding:30px 20px;
    background:linear-gradient(180deg,#0878d1,#034b91);
    border:5px solid #ffd900;
    border-radius:28px;
    box-shadow:0 12px 35px #000;
    text-align:center;
}

.decoracion{
    font-size:28px;
    letter-spacing:5px;
}

.icono{
    font-size:72px;
    margin:10px 0;
}

h1{
    font-size:clamp(36px,10vw,50px);
    margin:10px 0 20px;
    color:#ffd900;
    font-weight:1000;
    text-shadow:
        4px 4px 0 #0757a8,
        6px 6px 0 #032e5c;
}

.mensaje{
    font-size:17px;
    line-height:1.7;
    color:white;
    font-weight:600;
}

.final{
    margin-top:25px;
    padding:20px 16px;
    background:#0869bd;
    border:3px solid #ffd900;
    border-radius:20px;
}

.final p{
    line-height:1.6;
    color:white;
}

.final strong{
    color:#ffd900;
    text-shadow:2px 2px 0 #0757a8;
}

.corazon{
    font-size:48px;
    margin-top:20px;
}

.boton{
    display:block;
    width:100%;
    max-width:330px;
    margin:25px auto 0;
    padding:17px;
    border-radius:999px;
    background:#ffd900;
    color:#0757a8;
    text-decoration:none;
    font-weight:1000;
    font-size:17px;
    border:3px solid white;
    box-shadow:0 6px 0 #032e5c;
}

.volver{
    display:block;
    margin-top:20px;
    color:white;
    text-decoration:none;
    font-size:14px;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="regalo">

<div class="decoracion">
🏁 🏎️ 🏁
</div>

<div class="icono">
🎁❤️
</div>

<h1>
Mi regalo para vos
</h1>

<p class="mensaje">
Llegaste hasta el final... 💗
</p>

<div class="final">

<p>
<strong>
Espero que sepas que aunque estemos lejos siempre voy a pensar en vos mi gordito.
</strong>
</p>

<p>
Te amo con todo mi ser 💗
</p>

<div class="corazon">
🏎️❤️
</div>

<p>
<strong>
GRACIAS POR TODO MI GORDITO 🫶🏼
</strong>
</p>

</div>

<a class="boton" href="index.html">
🏎️ VOLVER AL INICIO
</a>

<a class="volver" href="recuerdos.html">
← Volver a los recuerdos
</a>

</div>

</div>

</body>
</html>
