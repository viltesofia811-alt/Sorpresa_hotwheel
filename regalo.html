<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi regalo para vos 💙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dff6ff, #8ed8ff, #4aa9e8);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.contenedor {
    width: 100%;
    max-width: 500px;
    background: rgba(255,255,255,0.96);
    border: 5px solid #1677b9;
    border-radius: 30px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,80,140,0.3);
}

.auto {
    font-size: 70px;
    margin-bottom: 10px;
}

h1 {
    color: #075b96;
    font-size: 30px;
}

p {
    color: #174b6b;
    font-size: 18px;
    line-height: 1.7;
}

button {
    margin-top: 25px;
    background: linear-gradient(135deg, #087ac1, #49bfff);
    color: white;
    border: none;
    padding: 16px 30px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,90,150,0.3);
}
</style>
</head>

<body>

<div class="contenedor">

<div class="auto">🏎️💙</div>

<h1>Mi regalo para vos 🩵</h1>

<p>
Espero que sepas que aunque estemos lejos siempre voy a pensar en vos mi gordito,
te amo con todo mi ser 💗
</p>

<p>
Gracias por estar siempre para mí y por compartir tantos momentos conmigo.
Este pequeño regalo está hecho especialmente para vos. 🫶🏼
</p>

<button onclick="location.href='index.html'">
🏎️ VOLVER AL INICIO
</button>

</div>

</body>
</html>
