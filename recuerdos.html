<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestros recuerdos 💙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dff6ff, #8ed8ff, #4aa9e8);
    padding: 25px 15px;
}

.contenedor {
    width: 100%;
    max-width: 550px;
    margin: auto;
    background: rgba(255,255,255,0.96);
    border: 5px solid #1677b9;
    border-radius: 30px;
    padding: 25px 15px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,80,140,0.3);
}

h1 {
    color: #075b96;
    font-size: 30px;
}

p {
    color: #174b6b;
    font-size: 18px;
    line-height: 1.5;
}

.foto {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    margin: 20px 0;
    border: 3px solid #8ed8ff;
}

button {
    margin-top: 20px;
    background: linear-gradient(135deg, #087ac1, #49bfff);
    color: white;
    border: none;
    padding: 16px 30px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,90,150,0.3);
}
</style>
</head>

<body>

<div class="contenedor">

<h1>📸 Nuestros recuerdos 💙</h1>

<p>
Algunos momentos que guardo con mucho cariño 🩵
</p>

<img class="foto" src="foto2.jpeg">
<img class="foto" src="foto3.jpeg">
<img class="foto" src="foto4.jpeg">

<button onclick="location.href='regalo.html'">
🎁 VER MI REGALO
</button>

</div>

</body>
</html>
